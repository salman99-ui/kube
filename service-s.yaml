apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - port: 8080
      targetPort: 80

---

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name:rs-nginx
spec:
  replicas: 2
  selector:
    app: nginx
  template:
    metadata:
      name: app-nginx
      labels:
        app: nginx
    spec:
      containers:
        - name: app-nginx
          image: nginx
          ports:
            - containerPort: 80


---

apiVersion: v1
kind: Pod
metadata:
  name: curl
  labels:
    name: curl
spec:
  containers:
    - name: curl
      image: nginx
      ports:
        - containerPort: 80