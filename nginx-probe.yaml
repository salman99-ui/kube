apiVersion: v1
metadata:
  name: nginx-probe
  labels:
    version: v1
  namespace: tech
spec:
  containers:
    - name: nginx-probe
      image: nginx
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        successThreshold: 1
        failureThreshold: 3

