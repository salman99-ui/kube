apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  volumes:  
    - name: data-volume
      emptyDir: {}
  containers:
    - name: app-nginx
      image: nginx
      command: ["sh", "-c", "echo 'created at startup' > /data/hello.txt"]
      ports:
        - containerPort: 80
      volumeMounts:
        - name: data-volume
          mountPath: /data
      