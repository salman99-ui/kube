apiVersion: v1
kind: Secret
metadata:
  name: app-secret
stringData:
  url_document: http://localhost:8080/document

---
apiVersion: v1
kind: Pod
metadata:
  name: apps
spec:
  containers:
    - name: apps
      image: nginx
      ports:
        - containerPort: 80
      envFrom:
        - secretRef:
            name: app-secret
