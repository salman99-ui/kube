apiVersion: v1
kind: Service
metadata:
  name: external-service
spec:
  type: ExternalName
  externalName: jsonplaceholder.typicode.com
  ports:
    - port: 8080
      targetPort: 443
  

---
apiVersion: v1
kind: Pod
metadata:
  name: curl
  labels:
    name: curl
spec:
  containers:
    - name: curl
      image: nginx
      ports:
        - containerPort: 80