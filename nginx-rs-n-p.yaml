apiVersion: v1
kind: Namespace
metadata:
  name: tech

---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-nginx
  namespace: tech
spec:
  replicas: 2
  selector:
    matchLabels:
      name: pod-nginx
  template:
    metadata:
      name: nginx
      labels:
        name: pod-nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
