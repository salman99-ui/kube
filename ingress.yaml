apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: app-nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-nginx
  template:
    metadata:
      name: app-nginx
      labels:
        app: app-nginx
    spec:
      containers:
        - name: app-nginx
          image: nginx
          ports:
            - containerPort: 80

---
apiVersion: networking.k8s.io/v1beta
kind: Ingress
metadata:
  name: nginx-ingress
  labels:
    name: nginx-ingress
spec:
  rules:
    - host: nginx.dev.local
      http:
        paths:
          - path: /
            backend:
              serviceName: nginx-service
              servicePort: 80
