apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      name: app-nginx
  template:
    metadata:
      name: app-nginx
      labels:
        name: app-nginx
        version: 2
    spec:
      containers:
        - name: app-nginx
          image: nginx
          ports:
            - containerPort: 80