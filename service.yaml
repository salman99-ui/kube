apiVersion: v1
kind: Service
metadata:
  name: web-api
  labels:
    name: web-api
spec:
  selector:
    app: web-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: my-nginx
spec:
  containers:
    - name: my-nginx
      image: nginx
