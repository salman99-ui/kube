apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  base_url: http://localhost:80
  app_version: 1.0.0

---

apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  volumes:
    - name: data-volume
      emptyDir: {}
  containers:
    - name: app-nginx
      image: nginx
      command:
        - sh
        - -c
        - "echo 'created at startup' > /data/hello.txt && exec nginx -g 'daemon off;'"
      ports:
        - containerPort: 80
      envFrom:
          - configMapRef:
              name: app-config
      volumeMounts:
        - name: data-volume
          mountPath: /data